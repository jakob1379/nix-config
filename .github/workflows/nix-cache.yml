---
name: Nix Cache
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {config: pi@raspberrypi, runner: ubuntu-24.04-arm}
          - {config: jga@yoga, runner: ubuntu-latest}
          - {config: jsg@amd, runner: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v14
        with:
          name: jakob1379
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Build home-manager configuration ${{ matrix.config }}
        run: nix build .#homeConfigurations."${{ matrix.config }}".activationPackage
