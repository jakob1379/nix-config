<style>
:root{--bg:#eef3fa;--ink:#1b2a4a;--mute:#6b7fa3;--wire:#c3d1e6;--a:#5277c3;--b:#7ebae4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a2e;--ink:#dce6f5;--mute:#7f93b8;--wire:#253656;--a:#7ebae4;--b:#5277c3}}
.bg{fill:var(--bg)}
text{fill:var(--ink);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.h{fill:var(--mute);font:12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.02em}
.m{fill:var(--mute)}
.w{fill:none;stroke:var(--wire);stroke-width:1.2}
.p{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:7 300;stroke-dashoffset:12;animation:7.0s linear infinite backwards}
.pi{stroke:var(--b);animation-name:in}
.po{stroke:var(--a);animation-name:out}
.dot{fill:var(--bg);stroke:var(--wire);stroke-width:1.4}
.lit{fill:var(--a);opacity:0;animation:lit 7.0s ease-out infinite backwards}
.hex{fill:var(--bg);stroke:var(--a);stroke-width:2}
.ring{fill:none;stroke:var(--b);stroke-width:1.5;opacity:0;transform-origin:430px 230px;animation:ring 7.0s ease-out infinite}
.core{fill:var(--a);transform-origin:430px 230px;animation:spin 42s linear infinite}
.fl{font-size:14px;font-weight:600}
@keyframes in{0%{stroke-dashoffset:12}34%{stroke-dashoffset:-104}100%{stroke-dashoffset:-104}}
@keyframes out{0%,44%{stroke-dashoffset:12}80%{stroke-dashoffset:-104}100%{stroke-dashoffset:-104}}
@keyframes lit{0%,78%{opacity:0}82%{opacity:1}100%{opacity:0}}
@keyframes ring{0%,34%{opacity:0;transform:scale(1)}38%{opacity:.9}58%{opacity:0;transform:scale(1.9)}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.p,.ring{display:none}.core,.lit{animation:none}}
</style>
